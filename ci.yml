name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [01-model-serving-platform, 02-backtest-harness, 03-streaming-features]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: pytest
