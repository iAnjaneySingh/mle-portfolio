services:
  kafka:
    image: bitnami/kafka:3.9
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # 6 partitions keyed by user_id: per-user ordering is preserved, and the
      # streaming job can scale to 6 parallel state-store tasks.
      KAFKA_CFG_NUM_PARTITIONS: "6"
    ports: ["9092:9092"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]

  spark:
    image: bitnami/spark:3.5
    depends_on: [kafka, redis]
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      DELTA_PATH: /data/delta
      CHECKPOINT_PATH: /data/checkpoints
    volumes:
      - ./:/app
      - spark-data:/data
    working_dir: /app
    command: >
      spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.4,io.delta:delta-spark_2.12:3.3.0
      --conf spark.jars.ivy=/tmp/.ivy
      -m src.streaming.job

volumes:
  spark-data:
